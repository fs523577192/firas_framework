spring.application.name=lowcode

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/lowcode}
spring.datasource.username=${DATABASE_USERNAME:lowcode}
spring.datasource.password=${DATABASE_PASSWORD:lowcode}

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

lowcode.access-control.bootstrap.enabled=true
lowcode.access-control.bootstrap.username=${ACCESS_CONTROL_ADMIN_USERNAME:admin}
lowcode.access-control.bootstrap.password=${ACCESS_CONTROL_ADMIN_PASSWORD:}
lowcode.access-control.bootstrap.role-code=super-admin
lowcode.access-control.bootstrap.role-description=Full control over access administration
